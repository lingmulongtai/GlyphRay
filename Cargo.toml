[workspace]
resolver = "2"
members = [
  "crates/audio",
  "crates/core",
  "crates/protocol",
  "crates/security",
  "crates/telemetry",
  "crates/transport",
  "hosts/windows-host",
  "hosts/windows-host/tools/capture-diagnostics",
  "hosts/windows-host/tools/host-diagnostics",
  "hosts/windows-host/tools/pen-diagnostics",
]
exclude = [
  "hosts/macos-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
bincode = "1.3"
crc32fast = "1.4"
hmac = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "1.0"
tracing = "0.1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
