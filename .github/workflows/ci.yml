name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main
      - trunk

jobs:
  rust-quality:
    name: Rust format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace

  windows-host:
    name: Windows host tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace with Win32 bindings
        run: cargo test --workspace
      - name: Build release host
        run: cargo build -p glyphray-windows-host --bin glyphray-windows-host --release

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Android unit tests
        run: ./gradlew :apps:android-client:testDebugUnitTest
      - name: Android lint
        run: ./gradlew :apps:android-client:lintRelease
      - name: Assemble debug
        run: ./gradlew :apps:android-client:assembleDebug
      - name: Assemble unsigned release bundle
        env:
          GLYPHRAY_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :apps:android-client:bundleRelease

  macos-host:
    name: macOS host SwiftPM build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Test macOS host
        working-directory: hosts/macos-host
        run: swift test -c release
      - name: Build macOS host
        working-directory: hosts/macos-host
        run: swift build -c release
