name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main
      - trunk

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Android unit tests
        run: ./gradlew :apps:android-client:testDebugUnitTest
      - name: Assemble debug
        run: ./gradlew :apps:android-client:assembleDebug

  macos-host:
    name: macOS host SwiftPM build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Build macOS host
        working-directory: hosts/macos-host
        run: swift build
