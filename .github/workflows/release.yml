name: Release Candidate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read and validate version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use major.minor.patch form: $version" >&2
            exit 1
          fi
          cargo_version="$(awk '/^\[workspace.package\]/{found=1; next} found && /^version = /{gsub(/[\"[:space:]]/, "", $3); print $3; exit}' Cargo.toml)"
          if [[ "$cargo_version" != "$version" ]]; then
            echo "Cargo workspace version $cargo_version does not match VERSION $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK and AAB
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - id: signing
        name: Restore optional Play signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          echo "signed=false" >> "$GITHUB_OUTPUT"
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glyphray-release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build release artifacts
        env:
          GLYPHRAY_VERSION_NAME: ${{ needs.metadata.outputs.version }}
          GLYPHRAY_VERSION_CODE: ${{ github.run_number }}
          GLYPHRAY_ANDROID_KEYSTORE: ${{ runner.temp }}/glyphray-release.keystore
          GLYPHRAY_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          GLYPHRAY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          GLYPHRAY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :apps:android-client:testDebugUnitTest :apps:android-client:lintRelease :apps:android-client:assembleRelease :apps:android-client:bundleRelease
      - name: Verify Android release signatures
        if: steps.signing.outputs.signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/android-client/build/outputs/apk/release/*.apk
          jarsigner -verify apps/android-client/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: glyphray-android-${{ needs.metadata.outputs.version }}
          path: |
            apps/android-client/build/outputs/apk/release/*.apk
            apps/android-client/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  windows:
    name: Windows MSI
    needs: metadata
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test Windows workspace
        run: cargo test --workspace
      - name: Install WiX Toolset
        shell: pwsh
        run: dotnet tool install --global wix --version "4.*"
      - id: signing
        name: Restore optional Authenticode certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:CERTIFICATE_BASE64 -and $env:CERTIFICATE_PASSWORD) {
            $certificatePath = "$env:RUNNER_TEMP\glyphray-signing.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "certificate_path=$certificatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - name: Build MSI
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ steps.signing.outputs.certificate_path }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./tools/packaging/windows/build-msi.ps1 -Version "${{ needs.metadata.outputs.version }}"
      - name: Verify Authenticode signatures
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $artifacts = @(
            "dist\windows\payload\glyphray-windows-host.exe",
            "dist\windows\GlyphRayHost-${{ needs.metadata.outputs.version }}.msi"
          )
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $artifact`: $($signature.StatusMessage)"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: glyphray-windows-${{ needs.metadata.outputs.version }}
          path: dist/windows/*.msi
          if-no-files-found: error

  macos:
    name: macOS app and pkg
    needs: metadata
    runs-on: macos-14
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      notarized: ${{ steps.signing.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
      - id: signing
        name: Restore optional Developer ID certificates
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APP_IDENTITY: ${{ secrets.MACOS_APP_SIGNING_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "notarized=false" >> "$GITHUB_OUTPUT"
          if [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" && -n "$APP_IDENTITY" && -n "$INSTALLER_IDENTITY" ]]; then
            keychain="$RUNNER_TEMP/glyphray-signing.keychain-db"
            certificate="$RUNNER_TEMP/glyphray-signing.p12"
            printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
            security create-keychain -p runner "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p runner "$keychain"
            security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -s -k runner "$keychain"
            security list-keychain -d user -s "$keychain" login.keychain-db
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_TEAM_ID" && -n "$NOTARY_PASSWORD" ]]; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build app and installer
        env:
          GLYPHRAY_VERSION: ${{ needs.metadata.outputs.version }}
          MACOS_APP_SIGNING_IDENTITY: ${{ secrets.MACOS_APP_SIGNING_IDENTITY }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: bash tools/packaging/macos/build-pkg.sh
      - name: Verify Developer ID package signature
        if: steps.signing.outputs.signed == 'true'
        run: pkgutil --check-signature dist/macos/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: glyphray-macos-${{ needs.metadata.outputs.version }}
          path: |
            dist/macos/*.pkg
            dist/macos/*.zip
          if-no-files-found: error

  publish:
    name: Checksums and GitHub release
    needs: [metadata, android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Enforce production signing for tags
        if: github.ref_type == 'tag'
        env:
          ANDROID_SIGNED: ${{ needs.android.outputs.signed }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
          MACOS_NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          if [[ "$ANDROID_SIGNED" != "true" || "$WINDOWS_SIGNED" != "true" || "$MACOS_SIGNED" != "true" || "$MACOS_NOTARIZED" != "true" ]]; then
            echo "Tagged releases require Android, Windows, and macOS signing plus macOS notarization secrets." >&2
            exit 1
          fi
      - name: Create SHA-256 manifest
        working-directory: dist/release
        run: find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: glyphray-release-${{ needs.metadata.outputs.version }}
          path: dist/release
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes --title "GlyphRay ${{ needs.metadata.outputs.version }}"
