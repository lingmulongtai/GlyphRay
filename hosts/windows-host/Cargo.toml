[package]
name = "glyphray-windows-host"
description = "Windows host foundation for GlyphRay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crc32fast.workspace = true
glyphray-core = { path = "../../crates/core" }
glyphray-protocol = { path = "../../crates/protocol" }
glyphray-security = { path = "../../crates/security" }
glyphray-telemetry = { path = "../../crates/telemetry" }
glyphray-transport = { path = "../../crates/transport" }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_WindowsAndMessaging",
] }
